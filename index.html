<!DOCTYPE html>
<html lang="en">
<head>

<title>Minute Fit</title>

<style>
:root{--bg:#F2F5F3;--card:#FFFFFF;--ink:#14303A;--mute:#56707A;--line:#D5DFDB;--accent:#F0B429;--on-accent:#14303A;--mob:#2A8C8C;--car:#D94F6B;--str:#5B5BD6;--danger:#C42B36;--on-danger:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1E24;--card:#183039;--ink:#EAF2EF;--mute:#9DB5BC;--line:#2A4650;--danger:#FF7A80;--on-danger:#14303A}}
:root[data-theme="dark"]{--bg:#0F1E24;--card:#183039;--ink:#EAF2EF;--mute:#9DB5BC;--line:#2A4650;--danger:#FF7A80;--on-danger:#14303A}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:calc(18px*var(--s,1))/1.45 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 18px 110px}
h1{font-size:calc(30px*var(--s,1));line-height:1.15;margin:8px 0 4px}
h2{font-size:calc(22px*var(--s,1));margin:26px 0 10px}
p{margin:0 0 10px}.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:center}.grow{flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 18px;min-height:52px}
.primary{background:var(--accent);color:var(--on-accent);font-weight:700;width:100%}
.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tag{display:inline-block;font-size:15px;font-weight:700;color:#fff;border-radius:8px;padding:2px 10px}
.mobility{background:var(--mob)}.cardio{background:var(--car)}.strength{background:var(--str)}
.week{display:flex;gap:8px;justify-content:space-between;margin:10px 0 4px}
.dot{flex:1;text-align:center;font-size:15px;color:var(--mute)}
.dot .l{margin-bottom:6px}
.rg{position:relative;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:calc(14px*var(--s,1));color:var(--ink)}
.rg svg{position:absolute;inset:0;width:100%;height:100%}
.dot.today .rg{box-shadow:0 0 0 2px var(--accent)}
.dot.today{color:var(--ink);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--mute);margin-top:8px}
.legend span:before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.session{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--ink);margin-bottom:12px;padding:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{text-align:center}.stat b{display:block;font-size:32px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mute);font-size:16px;min-height:56px}
nav button[aria-current="true"]{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
.video{aspect-ratio:16/9;width:100%;border-radius:16px;background:var(--line);display:grid;place-items:center;color:var(--mute);text-align:center;padding:12px;margin-bottom:12px;overflow:hidden}
.video video,.video img{width:100%;height:100%;object-fit:cover;border-radius:16px;pointer-events:none;display:block}.video .flip{transform:scaleX(-1)}.video:has(video,img){padding:0}
#player{position:fixed;inset:0;background:var(--bg);z-index:5;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 24px}
#player>div{max-width:560px;margin:0 auto}
.timer{font-size:84px;font-weight:700;text-align:center;line-height:1;margin:14px 0}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.note{font-size:calc(15px*var(--s,1));color:var(--mute)}
[hidden]{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between}.top b{font-size:20px}
.burger{background:var(--card);border:1px solid var(--line);color:var(--ink);width:52px;padding:0;display:grid;place-items:center}
#menu{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);display:flex;justify-content:flex-end}
#menu .sheet{background:var(--bg);width:min(340px,88%);height:100%;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 24px;overflow:auto}
.opts{display:flex;gap:8px;flex-wrap:wrap}.opts button{flex:1;padding:10px;min-height:48px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.opts button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.session{transition:box-shadow .3s,border-color .3s}.session.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.primary:disabled{opacity:.4;cursor:default}
.mgrp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px}
.mgrp h3{margin:0 0 10px;font-size:calc(17px*var(--s,1))}
.opts button{display:flex;justify-content:center;align-items:center;gap:8px;border-radius:12px}
.opts.col{flex-direction:column}.opts.col button{justify-content:space-between;text-align:left}
.mgrp .opts button{background:var(--bg)}
.mgrp .opts button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
@keyframes slide{from{transform:translateX(28px);opacity:0}}
#menu .sheet{animation:slide .2s ease-out}
@media (prefers-reduced-motion:reduce){#menu .sheet{animation:none}}
.danger{width:100%;background:transparent;color:var(--danger);border:2px solid var(--danger);font-weight:700}
.danger-fill{background:var(--danger);color:var(--on-danger);font-weight:700}
.danger-zone{margin-top:48px}
#dlg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:18px}
#dlg .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:400px;width:100%}
#dlg .box h2{margin-top:0}#dlg .row button{flex:1}
.ach summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none;min-height:40px}
.ach summary::-webkit-details-marker{display:none}
.ach summary span:after{content:"▾";margin-left:10px;display:inline-block;transition:transform .2s}
.ach[open] summary span:after{transform:rotate(180deg)}
.astats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 8px}
.ach h3{margin:14px 0 10px;font-size:calc(17px*var(--s,1))}
.cgrid{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cardbtn{background:none;padding:0;min-height:0;border-radius:12px;line-height:0}
.cardbtn svg{width:100%;height:auto;display:block}
#bub{position:absolute;width:220px;z-index:3;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;font-size:calc(15px*var(--s,1));line-height:1.35;text-align:left}
#bub:before{content:"";position:absolute;top:-6px;left:var(--ax,50%);width:12px;height:12px;background:inherit;transform:translateX(-50%) rotate(45deg)}
.stat b small{font-size:16px}
body{overflow-x:hidden}
#app{position:relative}
#nb{position:absolute;width:100%;padding:20px 18px 110px;box-sizing:border-box;pointer-events:none}
.mon{border-top:1px solid var(--line);padding:4px 0}
.mon summary:after{content:"▾";transition:transform .2s}.mon[open] summary:after{transform:rotate(180deg)}
.mon summary{font-weight:700}
.msum{font-size:calc(15px*var(--s,1));color:var(--mute);margin:0 0 8px}
.wl{font-size:calc(13px*var(--s,1));color:var(--mute);margin:8px 0 0}
.mon .week{margin:8px 0}.mon .week:first-of-type{margin:2px 0;color:var(--mute)}.mon .dot{position:relative}
.mbs{position:absolute;top:-8px;right:-5px;display:flex;pointer-events:none;z-index:1}.mb{display:block;line-height:0}.mb+.mb{margin-left:-9px}.mb svg{width:13px;height:17px;display:block}.mon .dot{font-size:calc(14px*var(--s,1))}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:6;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 24px}
#sheet>div{max-width:560px;margin:0 auto}
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.exc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 8px 12px;display:flex;flex-direction:column;gap:2px}
.exc b{margin-top:6px;padding:0 4px;line-height:1.25}.exc .mute{padding:0 4px;font-size:calc(15px*var(--s,1))}
.eximg{aspect-ratio:4/3;border-radius:12px;background:var(--bg);border:2px dashed var(--line);color:var(--mute);display:grid;place-items:center;overflow:hidden}
.eximg img{width:100%;height:100%;object-fit:cover;display:block}
.eximg:has(img){border:0}
button.eximg{width:100%;padding:0;min-height:0;position:relative;font:inherit}
.play{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
#vid{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:18px;overflow:auto}
.vbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;width:100%;max-width:560px}
.ring{position:relative;width:min(240px,68vw);margin:20px auto 6px}
.ring svg{display:block;width:100%;height:auto}
.seg-track,.seg-fill{fill:none;stroke-width:16;stroke-linecap:round}
.seg-track{stroke:var(--line)}
.seg-fill{stroke-dasharray:100 100;transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1)}
.ringc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1;pointer-events:none}
.ringc b{font-size:calc(46px*var(--s,1));display:block}.ringc span{font-size:calc(16px*var(--s,1));color:var(--mute)}
.ringc b.pop{animation:pop .45s ease-out}
@keyframes pop{40%{transform:scale(1.25)}}
.rlegend{justify-content:center;margin:2px 0 6px}
.fld{display:block;margin:16px 0 0}.fld span{display:block;font-weight:700;margin-bottom:6px}
.fld input{font:inherit;width:100%;min-height:52px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.fld input:focus{outline:none;border-color:var(--accent)}
#intro{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px 18px;overflow:auto;background:rgba(15,30,36,.25);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .3s ease-out}
.ibox{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 24px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:rise .35s ease-out}
.ibox .ilogo{display:block;margin:0 auto 14px}
.ibox h2{margin:0 0 12px;font-size:calc(26px*var(--s,1))}.ibox p{margin:0 0 24px;font-size:calc(19px*var(--s,1));line-height:1.55}
@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translateY(16px) scale(.97);opacity:0}}
@media (prefers-reduced-motion:reduce){#intro,.ibox{animation:none}}
#reward{position:fixed;inset:0;z-index:40;background:var(--rw,#14303A);color:#EAF2EF;overflow:auto;text-align:center;padding:calc(36px + env(safe-area-inset-top,0px)) 24px 28px}
.rw{max-width:420px;margin:0 auto}.rw h1{font-size:calc(34px*var(--s,1));margin:10px 0 0}
.stage{position:relative;width:230px;height:310px;margin:36px auto 0}
.stage:before{content:"";position:absolute;inset:-90px;border-radius:50%;background:repeating-conic-gradient(rgba(240,180,41,.16) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(closest-side,#000 40%,transparent);mask:radial-gradient(closest-side,#000 40%,transparent);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotate(-3deg);animation:flipin 1.1s cubic-bezier(.2,.8,.2,1) .3s both}
@keyframes flipin{0%{transform:rotateY(180deg) scale(.55)}55%{transform:rotateY(-14deg) scale(1.06)}100%{transform:rotateY(0) scale(1) rotate(-3deg)}}
.flip.still{animation:none}
.face{position:absolute;inset:0;border-radius:22px;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.back{transform:rotateY(180deg);background:var(--rw2,#1E4150);border:2px solid var(--rw3,#2E5A6B);display:grid;place-items:center;font-size:72px;font-weight:700;color:#F0B429}
.front{background:linear-gradient(160deg,rgba(255,255,255,.32),rgba(255,255,255,0) 50%,rgba(0,0,0,.14)),var(--c);color:#fff;padding:16px 18px;text-align:left;display:flex;flex-direction:column}
.front .cn{font-size:14px;font-weight:700;opacity:.85}.front svg{margin:22px auto 0;display:block}
.front h2{margin:auto 0 0;font-size:calc(24px*var(--s,1));line-height:1.15}.front p{margin:6px 0 0;font-size:calc(15px*var(--s,1));line-height:1.3;opacity:.95}
.rw .coll{margin:34px 0 0;color:#9DB5BC}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0 0;flex-wrap:wrap}.dots i{width:18px;height:24px;border-radius:4px;background:var(--rw2,#2A4650)}.dots i.on{background:#F0B429}
.rw .primary{margin-top:30px}
@media (prefers-reduced-motion:reduce){.stage:before{animation:none}}
/* ---- Styles: Garden and Night sky colours ---- */
:root[data-style="garden"]:not([data-x]){--bg:#E6EFE4;--card:#F7FBF5;--ink:#1D3A2C;--mute:#55705F;--line:#C9DBC6;--accent:#2F6B4F;--on-accent:#FFFFFF;--stem:#3E7A55;--leaf1:#5E9C6E;--leaf2:#78B487;--pot:#2E5843;--sky1:#F4F9F2;--sky2:#D6E7D2;--rw:#1D3A2C;--rw2:#2A4C3A;--rw3:#3B6650;--danger:#C42B36;--on-danger:#fff;color-scheme:light}
:root[data-style="night"]:not([data-x]){--bg:#0E1530;--card:#161F45;--ink:#E8ECFA;--mute:#9AA6D6;--line:#27326A;--accent:#F5C85A;--on-accent:#0E1530;--danger:#FF8A92;--on-danger:#0E1530;--rw:#0B1128;--rw2:#1B2656;--rw3:#2E3B78;color-scheme:dark}
:root[data-style="garden"] h1,.pcap{font-family:Lora,Georgia,serif;font-weight:600}
.scene{position:relative;margin:16px 0 4px;border-radius:28px;background:linear-gradient(var(--sky1),var(--sky2));overflow:hidden;padding:84px 10px 0}
.scene>svg{display:block;width:100%;max-width:330px;margin:0 auto;height:auto}
.scene.sky{background:radial-gradient(ellipse at 50% 120%,#2A3A7A,#121B42 60%,#0B1128);padding:84px 6px 10px}
.st{fill:none;stroke:var(--stem);stroke-linecap:round}
.fl .bloom{transform:scale(0);transition:transform .8s cubic-bezier(.3,1.7,.5,1)}
.fl .bud{transition:opacity .25s}.fl.open .bloom{transform:scale(1)}.fl.open .bud{opacity:0}
.seg-fill.sm{stroke-width:4}
.pchip{position:absolute;top:14px;right:14px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:calc(15px*var(--s,1));color:var(--mute)}
.pchip b{color:var(--ink);display:inline-block}
.pcap{position:absolute;top:12px;left:18px;right:110px;font-size:calc(19px*var(--s,1));line-height:1.2;margin:0;color:var(--ink)}
.sky .pcap{font-family:inherit;font-weight:700;color:#E8ECFA}.sky .pchip{background:#1B2656;border-color:#2E3B78;color:#9AA6D6}.sky .pchip b{color:#fff}
.pcap small{display:block;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:400;font-size:calc(14px*var(--s,1));color:var(--mute);margin-top:3px;line-height:1.3}
.sky .pcap small{color:#9AA6D6}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.wk{display:flex;flex-direction:column;font-size:calc(14px*var(--s,1));line-height:1.25}
.wkp{border-radius:14px;background:linear-gradient(var(--sky1),var(--sky2));padding:6px 2px 0;margin-bottom:6px}.wkp.sky{background:#121B42;padding:4px}
.wkp svg{display:block;width:100%;height:auto}
@media (prefers-reduced-motion:reduce){.fl .bloom{transition:none}}
.tipsh{margin:16px 0 6px;font-size:calc(17px*var(--s,1))}
.tips{margin:0;padding-left:22px}.tips li{margin:4px 0}.tips ul{margin:4px 0 0;padding-left:20px;list-style:disc}.tips>li{list-style:none;position:relative}
.tips>li:before{content:"";position:absolute;left:-17px;top:.5em;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.sinfo{position:absolute;top:8px;right:8px;width:44px;height:44px;min-height:0;padding:0;border-radius:50%;background:transparent;border:0;color:#9AA6D6;opacity:.7;display:grid;place-items:center;z-index:1}.sinfo:active{opacity:1}
.scene .pchip{top:auto;bottom:12px}.scene:not(.sky){padding-bottom:50px}.scene .pcap{right:64px}.ginfo{color:var(--mute)}
.story .stplant{background:linear-gradient(var(--sky1),var(--sky2));border-radius:18px;margin:-8px -8px 16px;padding:10px 10px 0}.story .stplant svg{display:block;width:100%;max-height:260px;height:auto}
.story .stsky{background:radial-gradient(ellipse at 50% 120%,#2A3A7A,#121B42 60%,#0B1128);border-radius:18px;margin:-8px -8px 16px;padding:6px}
.story .stsky svg{display:block;width:100%;height:auto}.story p{text-align:left;font-size:calc(17px*var(--s,1))}
.timer.pulse{animation:tpulse .45s ease-out}@keyframes tpulse{30%{transform:scale(1.12);color:var(--accent)}}
@media (prefers-reduced-motion:reduce){.timer.pulse{animation:none}}
/* Race-start countdown before a session: 3, 2, 1, then a green GO */
.cd{min-height:calc(100vh - 140px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cd .n{font-size:min(56vw,320px);font-weight:700;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;animation:cdpop .9s ease-out both}
.cd .n.go{font-size:min(15vw,96px);white-space:nowrap;color:#fff;background:#22B35E;border-radius:999px;padding:.12em .5em;box-shadow:0 0 0 14px rgba(34,179,94,.25),0 0 60px rgba(34,179,94,.6);animation:cdgo .6s ease-out both}
.cd .cdnext{margin:0 0 30px;font-size:calc(22px*var(--s,1));line-height:1.3}.cd .cdnext span{display:block;font-size:.7em;margin-bottom:4px}.cd .lights{display:flex;gap:14px;margin-bottom:28px}.cd .lights i{width:26px;height:26px;border-radius:50%;background:var(--line);transition:background .15s,box-shadow .15s}
.cd .lights i.on{background:#E5484D;box-shadow:0 0 14px rgba(229,72,77,.7)}.cd .lights.g i{background:#22B35E;box-shadow:0 0 14px rgba(34,179,94,.8)}
@keyframes cdpop{0%{transform:scale(1.6);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.85);opacity:.2}}
@keyframes cdgo{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.cd .n,.cd .n.go{animation:none}}
.donecard{position:relative;padding-right:56px}
.shareic{position:absolute;top:6px;right:6px;width:44px;height:44px;min-height:0;padding:0;border:0;background:transparent;color:var(--ink);display:grid;place-items:center}
.shareic svg{width:22px;height:22px}
.rwshare{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;color:#EAF2EF;z-index:1}
.recap h2{margin-bottom:14px}.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}

function tipsHTML(e){
  const list = TIPS[baseKey(e)]; if(!list || !list.length) return "";
  const li = x => Array.isArray(x) ? `<li>${L(x)}</li>` : `<li>${L(x.t)}<ul>${x.sub.map(y=>`<li>${L(y)}</li>`).join("")}</ul></li>`;
  return `<h3 class="tipsh">${t("focusOn")}</h3><ul class="tips">${list.map(li).join("")}</ul>`;
}

function apply(){
  const r = document.documentElement; r.lang = cfg.lang;
  if(cfg.theme==="auto") r.removeAttribute("data-theme"); else r.dataset.theme = cfg.theme;
  r.style.setProperty("--s", cfg.size); r.dataset.style = sty();

}

const day = d => new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Paris"}).format(d);
const mins = (s,lv) => Math.round(s.levels[lv||"beginner"].reduce((a,e)=>a+(e.gate?0:e.secs+(e.rest||0)),0)/60);

function durHTML(s){
  const m = [...new Set(LVS.map(lv=>mins(s,lv)))].sort((a,b)=>a-b);

}
function fmtTime(m){
  const h = Math.floor(m/60), r = m%60;
  return h<1 ? `${m}<small> min</small>` : `${h}<small> h</small>${r?" "+String(r).padStart(2,"0"):""}`;
}
function streak(){
  const days = new Set(log.map(l=>l.date)); let n=0, d=new Date();
  if(!days.has(day(d))) d.setDate(d.getDate()-1);
  while(days.has(day(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function weekDots(){
  const today = day(new Date()), tt = new Date(today+"T12:00:00Z"), by = {};
  log.forEach(l=>{ const s=SESSIONS.find(x=>x.id===l.session); if(s) (by[l.date]=by[l.date]||new Set()).add(s.type); });
  const cells = DAYS[cfg.lang].split("").map((n,i)=>{ const d=new Date(tt);
    d.setUTCDate(tt.getUTCDate()-((tt.getUTCDay()+6)%7)+i); const k=d.toISOString().slice(0,10);
    return `<div class="dot ${k===today?"today":""}"><div class="l">${n}</div><div class="rg" role="img" aria-label="${dayLabel(d.getUTCDate(),by[k])}">${miniRing(by[k])}<span>${d.getUTCDate()}</span></div></div>`; }).join("");
  return `<div class="week">${cells}</div><div class="legend"><span style="--c:var(--mob)">${tn("mobility")}</span><span style="--c:var(--car)">${tn("cardio")}</span><span style="--c:var(--str)">${tn("strength")}</span></div>`;
}
const TVAR = {mobility:"--mob",cardio:"--car",strength:"--str"};
function miniRing(types){
  const pt = a => { const r=a*Math.PI/180; return (50+40*Math.cos(r)).toFixed(1)+" "+(50+40*Math.sin(r)).toFixed(1); };
  return '<svg viewBox="0 0 100 100" aria-hidden="true">' + Object.keys(TN).map((ty,i)=>{ const a0=-90+8+i*120;
    return `<path d="M${pt(a0)} A40 40 0 0 1 ${pt(a0+104)}" fill="none" stroke="${types&&types.has(ty)?`var(${TVAR[ty]})`:"var(--line)"}" stroke-width="9" stroke-linecap="round"/>`; }).join("") + '</svg>';
}
const dayLabel = (n, types) => n + (types&&types.size ? ": "+[...types].map(ty=>tn(ty)).join(", ") : "");
function ringHTML(done, anim){
  const R=78, C=100, G=14, LEN=120-G, types=Object.keys(TN);
  const pt = a => { const r=a*Math.PI/180; return (C+R*Math.cos(r)).toFixed(2)+" "+(C+R*Math.sin(r)).toFixed(2); };
  const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
  const animating = !!(anim && anim.fresh && !reduce && done.has(anim.type));
  const segs = types.map((ty,i)=>{
    const a0 = -90+G/2+i*120, d = `M${pt(a0)} A${R} ${R} 0 0 1 ${pt(a0+LEN)}`;
    return `<path d="${d}" class="seg-track"/>` + (done.has(ty) ? `<path id="seg-${ty}" d="${d}" pathLength="100" class="seg-fill" style="stroke:var(${TVAR[ty]});stroke-dashoffset:${animating&&anim.type===ty?99.9:0}"/>` : "");
  }).join("");
  const n = types.filter(ty=>done.has(ty)).length, shown = n-(animating?1:0);
  return `<div class="ring" id="ring" role="img" aria-label="${n}/${types.length} ${t("today")}"><svg viewBox="0 0 200 200" aria-hidden="true">${segs}</svg>
  <div class="ringc"><b id="ringN">${shown}/${types.length}</b><span>${t("today")}</span></div></div>
  <div class="legend rlegend">${types.map(ty=>`<span style="--c:var(${TVAR[ty]});${done.has(ty)?"color:var(--ink);font-weight:700":""}">${tn(ty)}</span>`).join("")}</div>`;
}

const SKY_STORY = [
  ["In Greek myth, the nymph Callisto was turned into a bear, and Zeus placed her among the stars to keep her safe. These seven stars are the brightest part of her constellation, the Great Bear; in Britain they are called the Plough. Follow the two stars at the end of the bowl upwards and you will find the North Star: travellers have used this trick for thousands of years.",
   "Dans la mythologie grecque, la nymphe Callisto fut changée en ourse, et Zeus la plaça parmi les étoiles pour la protéger. Ces sept étoiles, que l'on surnomme aussi « la Casserole », en sont la partie la plus brillante. Prolongez vers le haut les deux étoiles du bout de la casserole et vous trouverez l'étoile Polaire : les voyageurs utilisent cette astuce depuis des millénaires.",
   "En la mitología griega, la ninfa Calisto fue convertida en osa, y Zeus la colocó entre las estrellas para protegerla. Estas siete estrellas, a las que muchos llaman «el Carro», son la parte más brillante de la Osa Mayor. Si prolongas hacia arriba las dos estrellas del extremo, encontrarás la Estrella Polar: los viajeros usan este truco desde hace miles de años."],
  ["Orion was a giant hunter of Greek legend. A scorpion stung him, and the gods placed both in the sky on opposite sides: when the Scorpion rises in the east, Orion sets in the west, so they never meet. Look for his belt of three stars in a row. Red Betelgeuse marks his shoulder and blue-white Rigel his foot.",
   "Orion était un chasseur géant de la mythologie grecque. Un scorpion le piqua, et les dieux les placèrent tous deux dans le ciel, de part et d'autre : quand le Scorpion se lève à l'est, Orion se couche à l'ouest, si bien qu'ils ne se croisent jamais. Cherchez sa ceinture de trois étoiles alignées. Bételgeuse, rouge, marque son épaule, et Rigel, bleu-blanc, son pied.",
   "Orión era un cazador gigante de la mitología griega. Un escorpión lo picó, y los dioses los colocaron a ambos en el cielo, en lados opuestos: cuando el Escorpión sale por el este, Orión se pone por el oeste, así que nunca se encuentran. Busca su cinturón de tres estrellas alineadas. Betelgeuse, roja, marca su hombro, y Rigel, blanco azulada, su pie."],
  ["The Pleiades are the seven daughters of the Titan Atlas. To protect them from Orion, who was chasing them, Zeus turned them into doves and then into stars, and Orion still follows them across the sky. Farmers and sailors in ancient Greece watched them to know when to sow, harvest or set sail. Most people can only see six: legend says the seventh sister hides her face. In Japan they are called Subaru.",
   "Les Pléiades sont les sept filles du Titan Atlas. Pour les protéger d'Orion qui les poursuivait, Zeus les changea en colombes, puis en étoiles, et Orion les suit encore dans le ciel. Dans la Grèce antique, paysans et marins les observaient pour savoir quand semer, récolter ou prendre la mer. On n'en voit souvent que six : la légende dit que la septième sœur cache son visage. Au Japon, on les appelle Subaru.",
   "Las Pléyades son las siete hijas del titán Atlas. Para protegerlas de Orión, que las perseguía, Zeus las convirtió en palomas y luego en estrellas, y Orión todavía las sigue por el cielo. En la antigua Grecia, campesinos y marineros las observaban para saber cuándo sembrar, cosechar o zarpar. La mayoría solo ve seis: la leyenda dice que la séptima hermana esconde su rostro. En Japón se llaman Subaru."],
  ["Cygnus is a swan flying along the Milky Way with its wings spread wide. In one Greek legend, Zeus took the form of a swan; in another, the musician Orpheus was turned into one and placed beside his lyre, the constellation Lyra. Its tail star, Deneb, is one of the most luminous stars we can see with the naked eye. Its shape is also known as the Northern Cross.",
   "Le Cygne vole le long de la Voie lactée, les ailes grandes ouvertes. Selon une légende grecque, Zeus prit la forme d'un cygne ; selon une autre, le musicien Orphée fut changé en cygne et placé près de sa lyre, la constellation de la Lyre. L'étoile de sa queue, Deneb, est l'une des plus lumineuses visibles à l'œil nu. On l'appelle aussi la Croix du Nord.",
   "El Cisne vuela a lo largo de la Vía Láctea con las alas bien abiertas. Según una leyenda griega, Zeus tomó la forma de un cisne; según otra, el músico Orfeo fue convertido en cisne y colocado junto a su lira, la constelación de Lyra. La estrella de su cola, Deneb, es una de las más luminosas que se ven a simple vista. También se la conoce como la Cruz del Norte."],
  ["This small half-circle of stars is the crown of Ariadne, the princess of Crete who helped Theseus escape the Minotaur's labyrinth with a ball of thread. When she married the god Dionysus, he threw her crown into the sky so that it would shine forever. Its brightest star is called Gemma, the jewel.",
   "Ce petit demi-cercle d'étoiles est la couronne d'Ariane, la princesse crétoise qui aida Thésée à sortir du labyrinthe du Minotaure grâce à une pelote de fil. Quand elle épousa le dieu Dionysos, il lança sa couronne dans le ciel pour qu'elle brille à jamais. Son étoile la plus brillante s'appelle Gemma, « le joyau ».",
   "Este pequeño semicírculo de estrellas es la corona de Ariadna, la princesa de Creta que ayudó a Teseo a salir del laberinto del Minotauro con un ovillo de hilo. Cuando se casó con el dios Dioniso, él lanzó su corona al cielo para que brillara para siempre. Su estrella más brillante se llama Gemma, «la joya»."],
  ["Leo is the Nemean lion, whose skin no weapon could pierce. Defeating it was the first of the twelve labours of Hercules, who then wore its skin as armour. Its head looks like a backwards question mark, with the bright star Regulus, 'the little king', at the bottom. Every November, the Leonid shooting stars seem to rain from this part of the sky.",
   "Le Lion est le lion de Némée, dont aucune arme ne pouvait percer la peau. Le vaincre fut le premier des douze travaux d'Hercule, qui porta ensuite sa peau comme une armure. Sa tête ressemble à un point d'interrogation à l'envers, avec en bas la brillante Régulus, « le petit roi ». Chaque mois de novembre, les étoiles filantes des Léonides semblent pleuvoir de cette région du ciel.",
   "Leo es el león de Nemea, cuya piel ninguna arma podía atravesar. Vencerlo fue el primero de los doce trabajos de Hércules, que después llevó su piel como armadura. Su cabeza parece un signo de interrogación al revés, con la brillante Régulo, «el pequeño rey», en la parte inferior. Cada noviembre, las estrellas fugaces Leónidas parecen llover desde esta zona del cielo."],
  ["At the tip of the Little Dipper's handle shines Polaris, the North Star. It sits almost exactly above the North Pole, so it barely moves while the whole sky turns around it, and sailors used it for centuries to find north. In Greek myth, these stars are Arcas, Callisto's son, placed in the sky next to his mother, the Great Bear.",
   "Au bout de la queue de la Petite Ourse brille l'étoile Polaire. Elle se trouve presque exactement au-dessus du pôle Nord : elle bouge à peine tandis que tout le ciel tourne autour d'elle, et les marins s'en sont servis pendant des siècles pour trouver le nord. Dans la mythologie grecque, ces étoiles sont Arcas, le fils de Callisto, placé dans le ciel à côté de sa mère, la Grande Ourse.",
   "En el extremo de la cola de la Osa Menor brilla la Estrella Polar. Está casi exactamente sobre el Polo Norte, así que apenas se mueve mientras todo el cielo gira a su alrededor, y los marineros la usaron durante siglos para encontrar el norte. En la mitología griega, estas estrellas son Arcas, el hijo de Calisto, colocado en el cielo junto a su madre, la Osa Mayor."],
  ["Taurus is the beautiful white bull that Zeus became to carry the princess Europa across the sea to Crete; our continent is named after her. The bull's red eye is the star Aldebaran, 'the follower', because it seems to chase the Pleiades across the sky. In 1054, astronomers in China saw a star explode here; its remains are the Crab Nebula.",
   "Le Taureau est le magnifique taureau blanc dont Zeus prit l'apparence pour emmener la princesse Europe en Crète, à travers la mer ; notre continent porte son nom. L'œil rouge du taureau est l'étoile Aldébaran, « celle qui suit », car elle semble poursuivre les Pléiades dans le ciel. En 1054, des astronomes chinois virent une étoile exploser à cet endroit : ses restes forment la nébuleuse du Crabe.",
   "Tauro es el hermoso toro blanco en el que se convirtió Zeus para llevar a la princesa Europa a través del mar hasta Creta; nuestro continente lleva su nombre. El ojo rojo del toro es la estrella Aldebarán, «la que sigue», porque parece perseguir a las Pléyades por el cielo. En 1054, astrónomos chinos vieron estallar una estrella en este lugar: sus restos forman la nebulosa del Cangrejo."],
  ["Aquila is the eagle that carried Zeus's thunderbolts. Its brightest star, Altair, spins so fast that it turns once in less than ten hours, compared with almost a month for our Sun. In an old East Asian legend, Altair is a cowherd separated from his love, the weaver Vega, by the river of the Milky Way. They may meet only once a year, on the seventh day of the seventh month, a day still celebrated in China and Japan.",
   "L'Aigle est l'oiseau qui portait les éclairs de Zeus. Son étoile la plus brillante, Altaïr, tourne si vite sur elle-même qu'elle fait un tour en moins de dix heures, contre près d'un mois pour notre Soleil. Selon une vieille légende d'Asie de l'Est, Altaïr est un jeune vacher séparé de sa bien-aimée, la tisserande Véga, par la rivière de la Voie lactée. Ils ne peuvent se retrouver qu'une fois par an, le septième jour du septième mois, une fête encore célébrée en Chine et au Japon.",
   "Águila es el ave que llevaba los rayos de Zeus. Su estrella más brillante, Altair, gira tan rápido que da una vuelta en menos de diez horas, frente a casi un mes de nuestro Sol. Según una antigua leyenda de Asia oriental, Altair es un pastor separado de su amada, la tejedora Vega, por el río de la Vía Láctea. Solo pueden encontrarse una vez al año, el séptimo día del séptimo mes, una fiesta que todavía se celebra en China y Japón."],
  ["Boötes is the herdsman who drives the Great Bear around the North Pole, night after night. His brightest star, Arcturus, means 'guardian of the bear'. It is the brightest star in the northern half of the sky and easy to find: follow the curve of the Big Dipper's handle. In 1933, its light was used to switch on the lights of the Chicago World's Fair.",
   "Le Bouvier est le gardien de troupeaux qui fait tourner la Grande Ourse autour du pôle Nord, nuit après nuit. Son étoile la plus brillante, Arcturus, signifie « le gardien de l'ourse ». C'est l'étoile la plus brillante de la moitié nord du ciel, et elle est facile à trouver : suivez la courbe de la queue de la Grande Ourse. En 1933, sa lumière servit à allumer les lumières de l'Exposition universelle de Chicago.",
   "El Boyero es el pastor que hace girar a la Osa Mayor alrededor del Polo Norte, noche tras noche. Su estrella más brillante, Arturo, significa «el guardián de la osa». Es la estrella más brillante de la mitad norte del cielo y es fácil de encontrar: sigue la curva de la cola de la Osa Mayor. En 1933, su luz se usó para encender las luces de la Exposición Universal de Chicago."],
  ["Pegasus is the winged horse born when the hero Perseus defeated Medusa. The hero Bellerophon rode him to defeat the Chimera, a fire-breathing monster, and Zeus then gave him a place among the stars. Look for the Great Square, four stars forming his body. In 1995, two Swiss astronomers discovered here the first planet ever found orbiting a star like our Sun, a discovery that later won the Nobel Prize.",
   "Pégase est le cheval ailé né lorsque le héros Persée vainquit Méduse. Le héros Bellérophon le monta pour vaincre la Chimère, un monstre qui crachait du feu, puis Zeus lui offrit une place parmi les étoiles. Cherchez le Grand Carré, quatre étoiles qui forment son corps. En 1995, deux astronomes suisses y découvrirent la première planète jamais trouvée autour d'une étoile semblable au Soleil, une découverte récompensée plus tard par le prix Nobel.",
   "Pegaso es el caballo alado que nació cuando el héroe Perseo venció a Medusa. El héroe Belerofonte lo montó para derrotar a la Quimera, un monstruo que escupía fuego, y luego Zeus le dio un lugar entre las estrellas. Busca el Gran Cuadrado, cuatro estrellas que forman su cuerpo. En 1995, dos astrónomos suizos descubrieron aquí el primer planeta hallado alrededor de una estrella parecida al Sol, un descubrimiento que más tarde recibió el Premio Nobel."],
  ["Canis Major is one of Orion's hunting dogs, faithfully following its master across the sky. In its chest shines Sirius, the brightest star in the night sky. The ancient Egyptians watched for Sirius to reappear at dawn each summer, because it announced the yearly flooding of the Nile. The hot 'dog days' of summer are named after it.",
   "Le Grand Chien est l'un des chiens de chasse d'Orion, qui suit fidèlement son maître dans le ciel. Sur sa poitrine brille Sirius, l'étoile la plus brillante du ciel nocturne. Les anciens Égyptiens guettaient son retour à l'aube chaque été, car il annonçait la crue du Nil. Notre mot « canicule » vient d'ailleurs du latin « canicula », « petite chienne », l'un des noms de Sirius.",
   "El Can Mayor es uno de los perros de caza de Orión, que sigue fielmente a su amo por el cielo. En su pecho brilla Sirio, la estrella más brillante del cielo nocturno. Los antiguos egipcios esperaban verla reaparecer al amanecer cada verano, porque anunciaba la crecida del Nilo. La palabra «canícula» viene del latín «canicula», «perrita», uno de los nombres de Sirio."],
  ["Gemini are the twins Castor and Pollux. Pollux was immortal, Castor was not; when Castor died, Pollux asked to share his immortality with his brother, so Zeus placed them side by side in the sky. Sailors saw them as protectors of ships at sea. Every December, the Geminids, one of the richest meteor showers of the year, seem to come from here.",
   "Les Gémeaux sont les jumeaux Castor et Pollux. Pollux était immortel, Castor non ; quand Castor mourut, Pollux demanda à partager son immortalité avec son frère, et Zeus les plaça côte à côte dans le ciel. Les marins voyaient en eux les protecteurs des navires. Chaque mois de décembre, les Géminides, l'une des plus belles pluies d'étoiles filantes de l'année, semblent venir d'ici.",
   "Géminis son los gemelos Cástor y Pólux. Pólux era inmortal y Cástor no; cuando Cástor murió, Pólux pidió compartir su inmortalidad con su hermano, y Zeus los colocó juntos en el cielo. Los marineros los veían como protectores de los barcos. Cada diciembre, las Gemínidas, una de las lluvias de estrellas más intensas del año, parecen salir de aquí."],
  ["Scorpius is the scorpion that stung Orion, which is why the two are never seen in the sky at the same time. Its heart is Antares, a red supergiant whose name means 'rival of Mars' because of its colour. It is so huge that, in place of our Sun, it would reach beyond the orbit of Mars. In summer, look low in the south for its long curved tail.",
   "Le Scorpion est celui qui piqua Orion : c'est pourquoi on ne les voit jamais ensemble dans le ciel. Son cœur est Antarès, une supergéante rouge dont le nom signifie « rival de Mars » à cause de sa couleur. Elle est si énorme qu'à la place de notre Soleil, elle dépasserait l'orbite de Mars. En été, cherchez sa longue queue recourbée, basse vers le sud.",
   "Escorpio es el escorpión que picó a Orión, por eso nunca se ven los dos a la vez en el cielo. Su corazón es Antares, una supergigante roja cuyo nombre significa «rival de Marte» por su color. Es tan enorme que, en el lugar de nuestro Sol, llegaría más allá de la órbita de Marte. En verano, busca su larga cola curvada, baja hacia el sur."],
  ["Lyra is the lyre of Orpheus, whose music could charm animals, trees and even stones; after his death, it was placed among the stars. Its brightest star, Vega, is one of the brightest in our sky. Because the Earth slowly wobbles like a spinning top, Vega was the North Star about 12,000 years ago and will be again in the distant future. In 1850, it became the first star, after the Sun, ever to be photographed.",
   "La Lyre est celle d'Orphée, dont la musique charmait les animaux, les arbres et même les pierres ; après sa mort, elle fut placée parmi les étoiles. Son étoile la plus brillante, Véga, est l'une des plus lumineuses de notre ciel. Comme la Terre oscille lentement à la manière d'une toupie, Véga était l'étoile polaire il y a environ 12 000 ans, et le redeviendra dans un lointain avenir. En 1850, elle fut la première étoile, après le Soleil, à être photographiée.",
   "Lira es la lira de Orfeo, cuya música encantaba a los animales, los árboles e incluso las piedras; tras su muerte, fue colocada entre las estrellas. Su estrella más brillante, Vega, es una de las más luminosas de nuestro cielo. Como la Tierra se balancea lentamente como una peonza, Vega fue la Estrella Polar hace unos 12 000 años y volverá a serlo en un futuro lejano. En 1850 se convirtió en la primera estrella, después del Sol, en ser fotografiada."],
  ["Hercules is the greatest hero of Greek myth, famous for his twelve labours; the first was defeating the Nemean lion, now the constellation Leo. In the sky he appears upside down, kneeling. Four of his stars form a shape called the Keystone. On one side of it lies a ball of several hundred thousand stars, the Great Cluster in Hercules: in 1974, a radio message from Earth was sent towards it.",
   "Hercule est le plus grand héros de la mythologie grecque, célèbre pour ses douze travaux ; le premier fut de vaincre le lion de Némée, devenu la constellation du Lion. Dans le ciel, il apparaît à l'envers, un genou à terre. Quatre de ses étoiles forment une figure appelée la Clé de voûte. Sur l'un de ses côtés se trouve une boule de plusieurs centaines de milliers d'étoiles, le Grand amas d'Hercule : en 1974, un message radio venu de la Terre a été envoyé dans sa direction.",
   "Hércules es el mayor héroe de la mitología griega, famoso por sus doce trabajos; el primero fue vencer al león de Nemea, hoy la constelación de Leo. En el cielo aparece boca abajo, con una rodilla en el suelo. Cuatro de sus estrellas forman una figura llamada la Piedra angular. A uno de sus lados hay una bola de varios cientos de miles de estrellas, el Gran Cúmulo de Hércules: en 1974 se envió hacia ella un mensaje de radio desde la Tierra."]
];
function showStory(k){
  const c = SKY[k];
  $("#intro").innerHTML = `<div class="ibox story"><div class="stsky">${skySvg(k,[3,3,3,3,3,3,3],-1)}</div>
  <h2>${L(c.n)}</h2><p>${L(SKY_STORY[k])}</p><button class="primary" onclick="closeStory()">${t("backSky")}</button></div>`;
  $("#intro").hidden = false;
}
function closeStory(){ if(!$("#intro .story")) return; $("#intro").hidden = true; $("#intro").innerHTML = ""; }
$("#intro").addEventListener("click", e => { if(e.target.id==="intro") closeStory(); });
/* Plant information shown with the (i) button in the Garden, same order as PLANTS. Texts: [EN, FR, ES] */
const PLANT_INFO = [
  ["Ferns are among the oldest plants on Earth: they were already growing more than 350 million years ago, long before the dinosaurs. They have no flowers and no seeds; they spread with tiny spores hidden under their leaves. They love shade and moisture, in forests and along streams, on every continent except Antarctica.",
   "Les fougères comptent parmi les plus anciennes plantes de la Terre : elles poussaient déjà il y a plus de 350 millions d'années, bien avant les dinosaures. Elles n'ont ni fleurs ni graines ; elles se reproduisent grâce à de minuscules spores cachées sous leurs feuilles. Elles aiment l'ombre et l'humidité, dans les forêts et au bord des ruisseaux, sur tous les continents sauf l'Antarctique.",
   "Los helechos están entre las plantas más antiguas de la Tierra: ya crecían hace más de 350 millones de años, mucho antes que los dinosaurios. No tienen flores ni semillas; se reproducen con diminutas esporas escondidas bajo sus hojas. Les encantan la sombra y la humedad, en bosques y junto a arroyos, en todos los continentes salvo la Antártida."],
  ["Cacti come from the Americas, mostly from hot, dry deserts. Their spines are in fact leaves: being so thin, they lose very little water, and the thick stem stores water for months. The giant saguaro of Arizona can live more than 150 years and grow over 12 metres tall.",
   "Les cactus viennent d'Amérique, surtout des déserts chauds et secs. Leurs épines sont en fait des feuilles : très fines, elles perdent très peu d'eau, et la tige épaisse en stocke pendant des mois. Le saguaro géant d'Arizona peut vivre plus de 150 ans et dépasser 12 mètres de haut.",
   "Los cactus vienen de América, sobre todo de desiertos cálidos y secos. Sus espinas son en realidad hojas: al ser tan finas, pierden muy poca agua, y el tallo grueso la almacena durante meses. El saguaro gigante de Arizona puede vivir más de 150 años y superar los 12 metros de altura."],
  ["Sunflowers come from North America, where Native Americans grew them more than 4,000 years ago. Young sunflowers follow the sun from east to west during the day. What looks like one big flower is actually made of up to 2,000 tiny flowers, each of which becomes a seed. They need full sun and warm summers.",
   "Le tournesol vient d'Amérique du Nord, où les Amérindiens le cultivaient il y a plus de 4 000 ans. Les jeunes tournesols suivent le soleil d'est en ouest au cours de la journée. Ce qui ressemble à une grande fleur est en réalité composé de jusqu'à 2 000 petites fleurs, qui deviennent chacune une graine. Il lui faut du plein soleil et des étés chauds.",
   "El girasol viene de América del Norte, donde los pueblos nativos ya lo cultivaban hace más de 4000 años. Los girasoles jóvenes siguen al sol de este a oeste durante el día. Lo que parece una gran flor está formado en realidad por hasta 2000 florecillas, y cada una se convierte en una semilla. Necesita pleno sol y veranos cálidos."],
  ["Oaks grow in forests across the Northern Hemisphere, from Europe to North America and Asia. They can live for several centuries, and some are more than a thousand years old. A single old oak is home to hundreds of species of insects, birds, mosses and mushrooms. Each autumn it drops acorns, which jays and squirrels bury and sometimes forget, planting new oaks.",
   "Les chênes poussent dans les forêts de tout l'hémisphère Nord, de l'Europe à l'Amérique du Nord et à l'Asie. Ils peuvent vivre plusieurs siècles, et certains ont plus de mille ans. Un seul vieux chêne abrite des centaines d'espèces d'insectes, d'oiseaux, de mousses et de champignons. Chaque automne, il laisse tomber ses glands, que geais et écureuils enterrent et parfois oublient, plantant ainsi de nouveaux chênes.",
   "Los robles crecen en bosques de todo el hemisferio norte, de Europa a América del Norte y Asia. Pueden vivir varios siglos, y algunos tienen más de mil años. Un solo roble viejo alberga cientos de especies de insectos, aves, musgos y hongos. Cada otoño deja caer sus bellotas, que los arrendajos y las ardillas entierran y a veces olvidan, plantando así nuevos robles."],
  ["Lavender comes from the Mediterranean, where it grows on sunny, dry and stony hillsides. Its name comes from the Latin 'lavare', to wash, because the Romans added it to their baths. In early summer, the fields of Provence turn purple and fill with the buzzing of bees.",
   "La lavande vient du bassin méditerranéen, où elle pousse sur des collines ensoleillées, sèches et caillouteuses. Son nom vient du latin « lavare », laver, car les Romains en parfumaient leurs bains. Au début de l'été, les champs de Provence deviennent violets et bourdonnent d'abeilles.",
   "La lavanda viene del Mediterráneo, donde crece en colinas soleadas, secas y pedregosas. Su nombre viene del latín «lavare», lavar, porque los romanos la añadían a sus baños. A principios del verano, los campos de la Provenza se vuelven morados y se llenan del zumbido de las abejas."],
  ["Monstera comes from the tropical rainforests of Central America, from southern Mexico to Panama. In the wild it climbs up tree trunks using its aerial roots. The holes in its large leaves may help sunlight reach the lower leaves and let heavy rain and wind pass through. That's why it's nicknamed the Swiss cheese plant.",
   "Le monstera vient des forêts tropicales d'Amérique centrale, du sud du Mexique au Panama. Dans la nature, il grimpe le long des troncs grâce à ses racines aériennes. Les trous de ses grandes feuilles aideraient la lumière à atteindre les feuilles du dessous et laisseraient passer la pluie et le vent. D'où son surnom de « plante gruyère ».",
   "La monstera viene de las selvas tropicales de América Central, del sur de México a Panamá. En la naturaleza trepa por los troncos gracias a sus raíces aéreas. Los agujeros de sus grandes hojas ayudarían a que la luz llegue a las hojas de abajo y dejarían pasar la lluvia y el viento. Por eso la llaman «costilla de Adán»."],
  ["Bamboo is actually a giant grass. It grows in warm and humid regions of Asia, Africa and the Americas. Some species are among the fastest-growing plants in the world, gaining almost a metre in a single day. Giant pandas eat almost nothing else, up to 12 hours a day.",
   "Le bambou est en réalité une herbe géante. Il pousse dans les régions chaudes et humides d'Asie, d'Afrique et d'Amérique. Certaines espèces comptent parmi les plantes qui poussent le plus vite au monde : presque un mètre en une seule journée. Les pandas géants ne mangent presque que ça, jusqu'à 12 heures par jour.",
   "El bambú es en realidad una hierba gigante. Crece en regiones cálidas y húmedas de Asia, África y América. Algunas especies están entre las plantas que más rápido crecen del mundo: casi un metro en un solo día. Los pandas gigantes casi no comen otra cosa, hasta 12 horas al día."],
  ["Cherry trees grow in temperate regions with cold winters, in Europe and Asia. In Japan, the blossoming of the ornamental cherry trees, called sakura, is a national celebration: people picnic under the flowers, a tradition called hanami. The blossoms only last a week or two, a reminder to enjoy each moment.",
   "Les cerisiers poussent dans les régions tempérées aux hivers froids, en Europe et en Asie. Au Japon, la floraison des cerisiers d'ornement, les sakura, est une fête nationale : on pique-nique sous les fleurs, une tradition appelée hanami. Les fleurs ne durent qu'une à deux semaines, comme un rappel de profiter de chaque instant.",
   "Los cerezos crecen en regiones templadas con inviernos fríos, en Europa y Asia. En Japón, la floración de los cerezos ornamentales, los sakura, es una fiesta nacional: la gente hace pícnics bajo las flores, una tradición llamada hanami. Las flores solo duran una o dos semanas, como un recordatorio de disfrutar cada momento."],
  ["Tulips first grew wild in the mountains of Central Asia. They were treasured in the Ottoman Empire and reached the Netherlands in the 16th century. In the 1630s, during 'tulip mania', a single rare bulb could cost as much as a house. Tulips need a cold winter to bloom in spring.",
   "Les tulipes poussaient d'abord à l'état sauvage dans les montagnes d'Asie centrale. Très appréciées dans l'Empire ottoman, elles arrivèrent aux Pays-Bas au XVIe siècle. Dans les années 1630, pendant la « tulipomanie », un seul bulbe rare pouvait coûter autant qu'une maison. Elles ont besoin d'un hiver froid pour fleurir au printemps.",
   "Los tulipanes crecían primero de forma silvestre en las montañas de Asia central. Muy apreciados en el Imperio otomano, llegaron a los Países Bajos en el siglo XVI. En la década de 1630, durante la «tulipomanía», un solo bulbo raro podía costar tanto como una casa. Necesitan un invierno frío para florecer en primavera."],
  ["Pines grow mostly in the Northern Hemisphere, from cold mountains to sandy coastlines. Their needles stay green all year round. Some are among the oldest living things on Earth: a bristlecone pine in California is more than 4,800 years old. Pine cones close when it's damp and open in dry weather to release their seeds.",
   "Les pins poussent surtout dans l'hémisphère Nord, des montagnes froides aux côtes sablonneuses. Leurs aiguilles restent vertes toute l'année. Certains comptent parmi les êtres vivants les plus vieux de la Terre : un pin de Californie a plus de 4 800 ans. Les pommes de pin se ferment par temps humide et s'ouvrent par temps sec pour libérer leurs graines.",
   "Los pinos crecen sobre todo en el hemisferio norte, de las montañas frías a las costas arenosas. Sus agujas se mantienen verdes todo el año. Algunos están entre los seres vivos más antiguos de la Tierra: un pino de California tiene más de 4800 años. Las piñas se cierran cuando hay humedad y se abren con tiempo seco para soltar sus semillas."],
  ["Succulents like this one, an echeveria, come from the dry, rocky slopes of Mexico and Central America. Their thick, fleshy leaves store water, so they can survive long droughts. A single leaf that falls to the ground can grow roots and become a whole new plant.",
   "Les plantes grasses comme celle-ci, une échévéria, viennent des pentes sèches et rocailleuses du Mexique et d'Amérique centrale. Leurs feuilles épaisses et charnues stockent l'eau, ce qui leur permet de survivre à de longues sécheresses. Une seule feuille tombée au sol peut faire des racines et devenir une nouvelle plante.",
   "Las suculentas como esta, una echeveria, vienen de las laderas secas y rocosas de México y América Central. Sus hojas gruesas y carnosas almacenan agua, lo que les permite sobrevivir a largas sequías. Una sola hoja caída al suelo puede echar raíces y convertirse en una planta nueva."],
  ["Palm trees grow in tropical and warm regions all around the world. Coconuts can float across the ocean for months and still sprout on a faraway beach, which is how coconut palms spread to so many islands. Unlike other trees, a palm's trunk does not get wider with age.",
   "Les palmiers poussent dans les régions tropicales et chaudes du monde entier. Une noix de coco peut flotter sur l'océan pendant des mois et germer quand même sur une plage lointaine : c'est ainsi que les cocotiers ont gagné tant d'îles. Contrairement aux autres arbres, le tronc d'un palmier ne s'élargit pas avec l'âge.",
   "Las palmeras crecen en regiones tropicales y cálidas de todo el mundo. Un coco puede flotar en el océano durante meses y aun así germinar en una playa lejana: así llegaron los cocoteros a tantas islas. A diferencia de otros árboles, el tronco de una palmera no se ensancha con la edad."],
  ["Wild roses grow across the Northern Hemisphere, and fossils show they existed millions of years ago. People have grown roses for thousands of years, from ancient China to Persia and Rome, and there are now thousands of varieties. After the flowers come rose hips, small fruits very rich in vitamin C.",
   "Les rosiers sauvages poussent dans tout l'hémisphère Nord, et des fossiles montrent qu'ils existaient déjà il y a des millions d'années. On cultive les roses depuis des millénaires, de la Chine ancienne à la Perse et à Rome, et il en existe aujourd'hui des milliers de variétés. Après les fleurs viennent les cynorhodons, de petits fruits très riches en vitamine C.",
   "Los rosales silvestres crecen en todo el hemisferio norte, y los fósiles muestran que ya existían hace millones de años. Las rosas se cultivan desde hace miles de años, de la antigua China a Persia y Roma, y hoy existen miles de variedades. Tras las flores llegan los escaramujos, pequeños frutos muy ricos en vitamina C."],
  ["Orchids form one of the largest families of flowering plants, with more than 25,000 species on every continent except Antarctica. Many tropical orchids grow high on tree branches, with their roots hanging in the air. Vanilla comes from an orchid. Their seeds are as fine as dust and need the help of a tiny fungus to sprout.",
   "Les orchidées forment l'une des plus grandes familles de plantes à fleurs, avec plus de 25 000 espèces sur tous les continents sauf l'Antarctique. Beaucoup d'orchidées tropicales poussent en hauteur sur les branches des arbres, les racines dans l'air. La vanille vient d'une orchidée. Leurs graines, fines comme de la poussière, ont besoin d'un minuscule champignon pour germer.",
   "Las orquídeas forman una de las familias de plantas con flores más grandes, con más de 25 000 especies en todos los continentes salvo la Antártida. Muchas orquídeas tropicales crecen en lo alto de las ramas, con las raíces al aire. La vainilla viene de una orquídea. Sus semillas, finas como el polvo, necesitan la ayuda de un diminuto hongo para germinar."],
  ["Hydrangeas come from Asia, especially Japan and China, and from the Americas. They like partial shade and moist soil, and you often see them in the gardens of Brittany. In some hydrangeas, the soil decides the colour: acidic soil gives blue flowers, chalky soil gives pink ones.",
   "Les hortensias viennent d'Asie, surtout du Japon et de Chine, ainsi que d'Amérique. Ils aiment la mi-ombre et les sols humides, et on les voit souvent dans les jardins bretons. Chez certains hortensias, c'est le sol qui décide de la couleur : un sol acide donne des fleurs bleues, un sol calcaire des fleurs roses.",
   "Las hortensias vienen de Asia, sobre todo de Japón y China, y también de América. Les gustan la semisombra y los suelos húmedos, y se ven a menudo en los jardines de Galicia y del norte de España. En algunas hortensias, el suelo decide el color: un suelo ácido da flores azules y uno calizo, flores rosas."],

/* ---- weeks (Monday to Sunday, Paris time) ---- */
const iso = d => d.toISOString().slice(0,10);
function weekStart(ds){ const d = new Date(ds+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)); return iso(d); }
/* All weeks from the first session to this week; k = 0 for the first week */
function weeks(){
  const now = weekStart(day(new Date())), first = log.length ? weekStart(log.map(l=>l.date).sort()[0]) : now, out = [];
  const dates = new Set(log.map(l=>l.date));
  for(let d = new Date(first+"T12:00:00Z"), k = 0; iso(d) <= now; d.setUTCDate(d.getUTCDate()+7), k++){
    const days = []; for(let i=0;i<7;i++){ const x = new Date(d); x.setUTCDate(x.getUTCDate()+i); days.push(dates.has(iso(x))); }
    const lv = days.map((on,i)=>{ if(!on) return 0; const x = new Date(d); x.setUTCDate(x.getUTCDate()+i); const ds = iso(x);
      return new Set(log.filter(l=>l.date===ds).map(l=>(SESSIONS.find(s=>s.id===l.session)||{}).type).filter(Boolean)).size; });
    out.push({k, start:iso(d), days, lv, n:days.filter(Boolean).length});
  }
  return out;
}

  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + at;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0+0.015); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+0.05);
  TONES.push({o, t0}); if(TONES.length>60) TONES.splice(0,30);
}

/* ---- Monday recap: shown once, the first time the app is opened in a new week ---- */
function weekStats(start){
  const end = new Date(start+"T12:00:00Z"); end.setUTCDate(end.getUTCDate()+7); const e = iso(end);
  const L7 = log.filter(l=>l.date>=start && l.date<e), by = {};
  L7.forEach(l=>{ const s = SESSIONS.find(x=>x.id===l.session); if(s) (by[l.date]=by[l.date]||new Set()).add(s.type); });
  return {sessions:L7.length, mins:L7.reduce((a,l)=>a+l.mins,0), days:Object.keys(by).length, by};
}
function checkRecap(){
  if(!cfg.started || !log.length || !$("#intro").hidden) return;
  const now = weekStart(day(new Date()));
  if(cfg.recapWeek===now) return;
  const first = weekStart(log.map(l=>l.date).sort()[0]);
  cfg.recapWeek = now; wr("fb-cfg",cfg);
  if(first>=now) return; /* first week of use: nothing to sum up yet */
  const pd = new Date(now+"T12:00:00Z"); pd.setUTCDate(pd.getUTCDate()-7); const prev = iso(pd), st = weekStats(prev);
  const W = weeks(), cur = W[W.length-1], last = W.find(w=>w.start===prev) || {k:cur.k-1, n:st.days};
  let html = `<h2>${t("recapT")}</h2>`;
  if(!st.sessions) html += `<p>${t("rFresh")}</p>`;
  else {
    html += `<div class="rstats"><div class="stat"><b>${st.days}</b><span class="mute">${t("rDays")}</span></div>
      <div class="stat"><b>${st.sessions}</b><span class="mute">${t("nsess")}</span></div><div class="stat"><b>${fmtTime(st.mins)}</b><span class="mute">${t("totalT")}</span></div></div>`;
    if(sty()==="original"){
      const cells = DAYS[cfg.lang].split("").map((n,i)=>{ const d = new Date(prev+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+i); const k = iso(d);
        return `<div class="dot"><div class="l">${n}</div><div class="rg">${miniRing(st.by[k])}<span>${d.getUTCDate()}</span></div></div>`; }).join("");
      html += `<div class="week">${cells}</div>`;
    } else if(sty()==="garden"){
      const p = PLANTS[last.k%PLANTS.length];
      html += `<p class="rlast"><b>${L(p.n)}</b><br>${st.days>=7 ? t("rFull") : t("rGrew").replace("{n}",st.days)}</p>`;
    } else {
      const c = SKY[last.k%SKY.length];
      html += `<p class="rlast"><b>${L(c.n)}</b><br>${st.days>=7 ? t("rSkyFull") : t("rStars").replace("{n}",st.days)}</p>`;
    }
  }
  if(sty()!=="original"){
    const garden = sty()==="garden", item = garden ? PLANTS[cur.k%PLANTS.length] : SKY[cur.k%SKY.length], nm = L(item.n);
    const pic = garden ? plantSvg(cur.k, 7, null, null) : skySvg(cur.k, [3,3,3,3,3,3,3], -1);
    html += `<div class="rnext"><p class="rnt">${t("nextT")}: <b>${nm}</b></p>
      <div class="rpic${garden?"":" sky"}">${pic}</div></div>`;
  }
  $("#intro").innerHTML = `<div class="ibox story recap">${html}<button class="primary" onclick="closeStory()">${t("letsGo")}</button></div>`;
  $("#intro").hidden = false;
}

      tilt:Math.random()*6.28, vt:.05+Math.random()*.15, c:cols[i%cols.length], ph:Math.random()*6.28};

    if(kind==="stars"){ p.w = 3+Math.random()*6; }

        ctx.globalAlpha = fade * Math.min(1, age/300) * (.55+.45*Math.sin(el/180+p.ph)); ctx.rotate(p.rot*.3); star4(p.w);
      } else if(kind==="petals"){
        ctx.globalAlpha = fade; ctx.rotate(p.rot); ctx.scale(1, .45+.55*Math.abs(Math.cos(p.tilt)));
        ctx.beginPath(); ctx.ellipse(0,0,p.w*.6,p.h*.6,0,0,6.29); ctx.fill();
      } else {

/* Replays the history in order: returns the stats and the date each card was unlocked */
function replay(entries){

  let run = 0, prev = null;
  entries.forEach(l=>{
    const s = SESSIONS.find(v=>v.id===l.session); if(!s) return;
    x.sessions++;
    if(l.date!==prev){ run = prev && (new Date(l.date+"T12:00:00Z")-new Date(prev+"T12:00:00Z"))===864e5 ? run+1 : 1; x.best = Math.max(x.best,run); prev = l.date; }
    const ty = (types[l.date] = types[l.date] || new Set()), had = ty.size; ty.add(s.type);
    if(had<3 && ty.size>=Object.keys(TN).length) x.full++;
    if(l.h!=null){ if(l.h>=5 && l.h<9) x.early = true; if(l.h>=20 || l.h<5) x.evening = true; }
    const wd = new Date(l.date+"T12:00:00Z").getUTCDay(); if(wd===0 || wd===6) x.weekend = true;
    if(l.level==="intermediate" || l.level==="expert") x.lvl2 = true;
    if(l.level==="expert") x.expert = true;
    CARDS.forEach(c=>{ if(!on[c.id] && c.ok(x)) on[c.id] = l.date; });
  });
  return {x, on};
}

document.addEventListener("touchmove", e => {
  if(!D) return; const p = e.touches[0], dx = p.clientX-D.x, dy = p.clientY-D.y;
  if(!D.lock){ if(Math.abs(dx)<8 && Math.abs(dy)<8) return; D.lock = Math.abs(dx)>Math.abs(dy)*1.2 ? "h" : "v"; }
  if(D.lock!=="h") return;

  const side = dx<0 ? 1 : -1; if(side!==D.side) setNb(side);

  $("#sheet").innerHTML = `<div><div class="top"><span class="tag ${s.type}">${tn(s.type)}</span><button class="burger" onclick="closeSheet()" aria-label="${t("close")}">${XI}</button></div>
  <h1>${L(s.name)}</h1><p class="mute">${L(s.desc)}</p><h2>${t("lvlQ")}</h2>` +
  LVS.map(lv=>`<button class="session" onclick="pickLevel('${id}','${lv}')"><div class="row"><div class="grow"><h2 style="margin:0 0 2px">${t("lv_"+lv)}</h2><span class="mute">${t("ld_"+lv)}</span></div><b>${mins(s,lv)} min</b></div></button>`).join("") + `</div>`;
  $("#sheet").hidden = false; $("#sheet").scrollTop = 0;
}
function pickLevel(id, lv){
  const s = SESSIONS.find(x=>x.id===id);
  $("#sheet").innerHTML = `<div><div class="top"><button class="ghost" onclick="openSheet('${id}')">‹ ${t("back")}</button><button class="burger" onclick="closeSheet()" aria-label="${t("close")}">${XI}</button></div>
  <p style="margin-top:16px"><span class="tag ${s.type}">${tn(s.type)}</span> <span class="tag" style="background:var(--ink);color:var(--bg)">${t("lv_"+lv)}</span></p>
  <h1>${L(s.name)}</h1><p class="mute">${L(s.desc)}</p><p style="font-size:calc(24px*var(--s,1));font-weight:700;margin:18px 0">${mins(s,lv)} min</p>` +
  `<button class="primary" onclick="start('${id}','${lv}')">${t("start")}</button></div>`;
  $("#sheet").scrollTop = 0;
}
function closeSheet(){ $("#sheet").hidden = true; }

/* ---- Session player ---- */
function start(id, lv){
  audio(); /* the tap on "Start session" lets the phone play sounds later */
  closeSheet(); lv = lv||"beginner";
  const s = SESSIONS.find(x=>x.id===id), steps = s.levels[lv], total = steps.filter(e=>!e.gate).length;
  let i=0, phase="work", left=0, dur=1, paused=false;
  $("#player").hidden=false; $("#tabs").hidden=true;
  const num = k => steps.slice(0,k+1).filter(e=>!e.gate).length;
  const endBtn = `<p style="margin-top:14px"><button class="ghost" style="width:100%" id="qt">${t("end")}</button></p>`;
  function show(){
    const e = steps[i]; paused = false;
    const nxt = steps.slice(i+1).find(x=>!x.gate);
    if(e.gate && phase!=="ready"){
      phase = "gate";
      $("#player").innerHTML = `<div><h1 style="margin-top:40px">${L(e.title)}</h1><p class="mute">${L(e.sub)}</p>${nxt?`<p class="mute">${t("nextUp")} <b style="color:var(--ink)">${L(nxt.name)}</b></p>`:""}<button class="primary" id="nx">${t("nextB")}</button>${endBtn}</div>`;
      $("#nx").onclick = () => countdown(nxt, () => { i++; phase = "work"; planned = true; show(); }); $("#qt").onclick = () => finish(false); return;
    }
    /* "ready" = 5-second countdown after the stop, so people can get into position */
    const rest = phase==="rest", ready = phase==="ready", cur = ready ? nxt : e;
    dur = left = ready ? 5 : rest ? e.rest : e.secs;
    const body = ready
      ? `<h1>${t("getReady")}</h1><p style="font-size:calc(24px*var(--s,1));font-weight:700">${L(nxt.name)}</p>`
      : rest
      ? `<h1>${t("rest")}</h1>${e.restMsg?`<p style="font-size:calc(24px*var(--s,1));font-weight:700">${L(e.restMsg)}</p>`:""}${nxt?`<p class="mute">${t("nextUp")} ${L(nxt.name)}</p>`:""}`
      : `<h1>${L(e.name)}</h1><div class="video">${media(e)}</div>${L(e.cue)?`<p>${L(e.cue)}</p>`:""}`;
    $("#player").innerHTML = `<div><div class="row"><span class="tag ${cur.type}">${tn(cur.type)}</span><span class="grow"></span><span class="mute">${num(i)+(ready?1:0)} ${t("of")} ${total}</span></div>
      ${body}<div class="timer" id="t"></div><div class="bar"><i id="b"></i></div>
      <div class="row"><button class="ghost grow" id="pp">${t("pause")}</button><button class="ghost grow" id="nx">${t("skip")}</button></div>${endBtn}</div>`;
    $("#pp").onclick = () => { paused=!paused; const v = $("#player video"); if(paused){ cancelSounds(); planned = false; if(v) v.pause(); } else if(v) v.play().catch(()=>{}); $("#pp").textContent=t(paused?"resume":"pause"); };
    $("#nx").onclick = skip; $("#qt").onclick = () => finish(false);
    tick();
    if(!ready && !planned) (rest ? sfxRest : sfxGo)();
    planned = false;
  }
  function tick(){
    $("#t").textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
    $("#b").style.width = (100*(dur-left)/dur)+"%";
  }
  function skip(){ cancelSounds(); planned = false; advance(); }
  function advance(){
    const e = steps[i];
    if(phase==="work" && e.rest>0){ phase="rest"; show(); return; }
    i++; phase = "work";
    if(i>=steps.length) finish(true); else show();
  }
  function finish(ok){
    clearInterval(timer); cancelSounds();
    if(ok){
      const k = day(new Date()), had = log.some(l=>l.date===k && (SESSIONS.find(x=>x.id===l.session)||{}).type===s.type);
      const before = replay(log).on;
      const h = Number(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Paris",hour:"2-digit",hourCycle:"h23"}).format(new Date()));
      log.push({date:k, session:s.id, level:lv, mins:mins(s,lv), h}); wr("fb-log",log);
      const after = replay(log).on, cards = CARDS.filter(c=>after[c.id] && !before[c.id]);
      if(cfg.remind) os(O => O.User.addTag("done", k));
      celebrate = {type:s.type, fresh:!had, cards};
    }
    close();
  }
  function close(){ $("#player").hidden=true; $("#player").innerHTML=""; $("#tabs").hidden=false; tab="today"; render(); window.scrollTo(0,0); }
  clearInterval(timer);
  /* Countdown: when 3 seconds are left, the ticks and the next sound are all planned at once, 1 second apart */
  let planned = false;
  function planCountdown(){
    if(planned) return; planned = true;
    const e = steps[i], nextStep = steps[i+1];
    const next = phase==="work" ? (e.rest>0 ? "rest" : (nextStep && !nextStep.gate ? "go" : "")) : "go";
    for(let k=0;k<left;k++) sfxTick(k);
    if(next==="go") sfxGo(left); else if(next==="rest") sfxRest(left); else planned = false;
  }
  timer = setInterval(()=>{ if(paused || phase==="gate" || phase==="intro") return; left--; if(left<=0) advance(); else { tick();
    if(left>=1 && left<=3){ planCountdown(); const el = $("#t"); if(el){ el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse"); } } } },1000);
  /* Before the session: big 3, 2, 1 with lights, then a green GO (sounds planned on the audio clock so they stay even) */
  let cdTimers = [];
  function countdown(upcoming, then){
    phase = "intro";
    const draw = k => { const go = k===0;
      $("#player").innerHTML = `<div><div class="cd"><p class="cdnext"><span class="mute">${t("nextUp")}</span><b>${L(upcoming.name)}</b></p><div class="lights${go?" g":""}">${[3,2,1].map(n=>`<i class="${!go&&n>=k?"on":""}"></i>`).join("")}</div>
        <div class="n${go?" go":""}">${go?t("goT"):k}</div></div>${endBtn}</div>`;
      $("#qt").onclick = () => { cdTimers.forEach(clearTimeout); cancelSounds(); clearInterval(timer); close(); }; };
    draw(3); sfxTick(0); sfxTick(1); sfxTick(2); sfxGo(3);
    cdTimers = [setTimeout(()=>draw(2),1000), setTimeout(()=>draw(1),2000), setTimeout(()=>draw(0),3000),
      setTimeout(then, 3800)];
  }
  countdown(steps.find(x=>!x.gate), () => { phase = "work"; planned = true; show(); });
}
apply(); render(); checkRecap();
</script>
